<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
    <span class="flex items-center gap-3">
      <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-lg font-bold text-white" aria-hidden="true">B</span>
      <span class="text-xl font-bold tracking-tight">Brandier</span>
    </span>
    <button type="button" class="botao-secundario" [disabled]="saindo()" (click)="sair()">
      {{ saindo() ? 'Saindo...' : 'Sair' }}
    </button>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4 py-10">
  <h1 class="text-2xl font-bold tracking-tight">Olá, {{ usuario()?.nome }}!</h1>
  <p class="mt-2 text-slate-600">
    Sua conta está ativa ({{ usuario()?.email }}). O painel com marcas, lojas, promotores e reposições está em
    construção.
  </p>
</main>
