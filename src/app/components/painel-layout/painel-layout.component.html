<div class="flex min-h-screen flex-col">
  <header class="border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-x-4 gap-y-2 px-4 py-3">
      <a routerLink="/painel" class="flex items-center gap-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600/40" aria-label="Brandier, início do painel">
        <img src="logo.webp" alt="" class="h-9 w-9 rounded-xl" aria-hidden="true" />
        <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Brandier</span>
      </a>

      <div class="flex flex-wrap items-center justify-end gap-x-3 gap-y-2">
        <a routerLink="/painel/conta" class="link-discreto text-sm" data-testid="link-conta">Minha conta</a>
        <app-tema-toggle />
        <button type="button" class="botao-secundario" [disabled]="saindo()" (click)="sair()">
          {{ saindo() ? 'Saindo...' : 'Sair' }}
        </button>
      </div>
    </div>

    <nav class="border-t border-slate-100 dark:border-slate-800" aria-label="Menu do painel">
      <ul class="mx-auto flex max-w-5xl gap-1 overflow-x-auto px-4 text-sm font-medium">
        <li>
          <a
            routerLink="/painel"
            routerLinkActive="menu-link-ativo"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="menu-link"
          >Início</a>
        </li>
        <li>
          <a
            routerLink="/painel/marcas"
            routerLinkActive="menu-link-ativo"
            ariaCurrentWhenActive="page"
            class="menu-link"
          >Marcas</a>
        </li>
        <li>
          <a
            routerLink="/painel/reposicoes"
            routerLinkActive="menu-link-ativo"
            ariaCurrentWhenActive="page"
            class="menu-link"
          >Reposições</a>
        </li>
        <li>
          <a
            routerLink="/painel/relatorios"
            routerLinkActive="menu-link-ativo"
            ariaCurrentWhenActive="page"
            class="menu-link"
          >Relatórios</a>
        </li>
        <li>
          <a
            routerLink="/painel/promotor"
            routerLinkActive="menu-link-ativo"
            ariaCurrentWhenActive="page"
            class="menu-link"
          >
            Como promotor
            @if (convites.totalPendentes() > 0) {
              <span class="rounded-full bg-indigo-600 px-1.5 text-xs font-semibold text-white" data-testid="selo-convites" [attr.aria-label]="convites.totalPendentes() + (convites.totalPendentes() === 1 ? ' convite pendente' : ' convites pendentes')">{{ convites.totalPendentes() }}</span>
            }
          </a>
        </li>
        <li>
          <a
            routerLink="/painel/como-funciona"
            routerLinkActive="menu-link-ativo"
            ariaCurrentWhenActive="page"
            class="menu-link"
          >Como funciona</a>
        </li>
        <li>
          <a
            routerLink="/painel/sobre"
            routerLinkActive="menu-link-ativo"
            ariaCurrentWhenActive="page"
            class="menu-link"
          >Sobre</a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
    <div class="mx-auto max-w-5xl px-4 py-4 text-center text-xs text-slate-500 dark:text-slate-400">
      Projeto de portfólio, não é para uso comercial.
      <a routerLink="/painel/sobre" class="link-discreto">Sobre o projeto</a>
    </div>
  </footer>
</div>
